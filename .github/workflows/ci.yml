name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional providers
        run: python -m pip install --upgrade pip && python -m pip install .[anthropic,deepseek]
      - name: Dependency consistency
        run: python -m pip check
      - name: Import and entry points
        run: |
          python -c "import mission_orchestrator; print(mission_orchestrator.__file__)"
          mission --help
          mission-worker --help
          code-graph --help
      - name: Full test suite
        run: python -m unittest discover -s tests
