<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERO — living blackboard</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2d323b; --text: #d7dae0; --dim: #8a919e;
    --create: #4ade80; --change: #fbbf24; --remove: #f87171; --keep: #6b7280; --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; letter-spacing: .04em; }
  header .meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1; min-width: 0; position: relative; }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #canvas.panning { cursor: grabbing; }
  #legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 11px; color: var(--dim); display: flex; gap: 12px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  aside { width: clamp(260px, 34vw, 380px); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  section { border-bottom: 1px solid var(--line); padding: 10px 12px; overflow: auto; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 6px; }
  #diff-section { flex: 0 0 auto; max-height: 34%; }
  #diff-text { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; margin: 0 0 8px; }
  #diff-text .add { color: var(--create); } #diff-text .mod { color: var(--change); } #diff-text .del { color: var(--remove); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: var(--line); color: var(--text); border: 1px solid #3a404b; border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  #approve { background: #14532d; } #reject { background: #58151c; }
  #answer-row { display: flex; gap: 6px; margin-top: 6px; }
  #answer { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font-size: 12px; }
  #events-section { flex: 1 1 auto; }
  #events { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  #events li { padding: 3px 0; border-bottom: 1px dotted #262b33; }
  #events .t { color: var(--dim); margin-right: 6px; font-family: Consolas, monospace; font-size: 11px; }
  #events .k { color: var(--accent); margin-right: 6px; }
  #history-section { flex: 0 0 auto; max-height: 22%; }
  #history { list-style: none; margin: 0; padding: 0; font-size: 11px; color: var(--dim); font-family: Consolas, monospace; }
  .node rect { rx: 7; stroke-width: 1.6; fill: var(--panel); }
  .node text { fill: var(--text); font-size: 12px; }
  .node .sub { fill: var(--dim); font-size: 10px; }
  .node.CREATE rect { stroke: var(--create); } .node.CHANGE rect { stroke: var(--change); }
  .node.REMOVE rect { stroke: var(--remove); stroke-dasharray: 5 3; } .node.KEEP rect { stroke: var(--keep); }
  .edge line { stroke: #4b5261; stroke-width: 1.2; } .edge.CREATE line { stroke: var(--create); }
  .edge.REMOVE line { stroke: var(--remove); stroke-dasharray: 5 3; }
  .edge text { fill: var(--dim); font-size: 10px; }
  .lane-label { fill: #3d4450; font-size: 11px; letter-spacing: .1em; }
</style>
</head>
<body>
<header>
  <h1>HERO</h1>
  <span class="meta" id="mission-meta">connecting…</span>
  <span class="meta" id="snapshot-meta"></span>
</header>
<main>
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 z" fill="#4b5261"/>
        </marker>
      </defs>
      <g id="scene"></g>
    </svg>
    <div id="legend">
      <span><i style="background:var(--create)"></i>CREATE</span>
      <span><i style="background:var(--change)"></i>CHANGE</span>
      <span><i style="background:var(--remove)"></i>REMOVE</span>
      <span><i style="background:var(--keep)"></i>KEEP</span>
    </div>
  </div>
  <aside>
    <section id="diff-section">
      <h2>Pending design diff</h2>
      <pre id="diff-text">loading…</pre>
      <div class="actions">
        <button id="approve">Approve</button>
        <button id="reject">Reject…</button>
        <button id="abort">Abort…</button>
      </div>
      <div id="answer-row">
        <input id="answer" placeholder="reply to the agent…">
        <button id="send">Send</button>
      </div>
    </section>
    <section id="events-section">
      <h2>Events</h2>
      <ul id="events"></ul>
    </section>
    <section id="history-section">
      <h2>Design history</h2>
      <ul id="history"></ul>
    </section>
  </aside>
</main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get("token") || "";
  const api = (path) => fetch(path, { headers: { "Authorization": "Bearer " + token } });

  // --- viewBox zoom & pan ---
  const svg = document.getElementById("canvas");
  const view = { x: 0, y: 0, w: 1200, h: 640 };
  const applyView = () => svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  applyView();
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.12 : 0.9;
    const rect = svg.getBoundingClientRect();
    const mx = view.x + (e.clientX - rect.left) / rect.width * view.w;
    const my = view.y + (e.clientY - rect.top) / rect.height * view.h;
    view.x = mx - (mx - view.x) * factor; view.y = my - (my - view.y) * factor;
    view.w *= factor; view.h *= factor;
    applyView();
  }, { passive: false });
  let pan = null;
  svg.addEventListener("mousedown", (e) => { pan = { x: e.clientX, y: e.clientY }; svg.classList.add("panning"); });
  window.addEventListener("mouseup", () => { pan = null; svg.classList.remove("panning"); });
  window.addEventListener("mousemove", (e) => {
    if (!pan) return;
    const rect = svg.getBoundingClientRect();
    view.x -= (e.clientX - pan.x) / rect.width * view.w;
    view.y -= (e.clientY - pan.y) / rect.height * view.h;
    pan = { x: e.clientX, y: e.clientY };
    applyView();
  });

  // --- graph rendering: one lane per level ---
  const LANES = ["SYSTEM", "PACKAGE", "CODE"];
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  };

  function renderMap(map) {
    const scene = document.getElementById("scene");
    scene.innerHTML = "";
    const laneY = {}; const positions = {};
    const lanes = LANES.filter(l => map.nodes.some(n => n.level === l));
    lanes.forEach((lane, i) => {
      laneY[lane] = 110 + i * 190;
      el("text", { x: 20, y: laneY[lane] - 60, class: "lane-label" }, scene).textContent = lane;
      el("line", { x1: 0, y1: laneY[lane] - 75, x2: 4000, y2: laneY[lane] - 75, stroke: "#20242b" }, scene);
    });
    lanes.forEach(lane => {
      const nodes = map.nodes.filter(n => n.level === lane);
      nodes.forEach((n, i) => { positions[n.id] = { x: 90 + i * 260, y: laneY[lane] }; });
    });
    for (const e of map.edges) {
      const a = positions[e.source], b = positions[e.target];
      if (!a || !b) continue;
      const group = el("g", { class: "edge " + e.intent }, scene);
      el("line", { x1: a.x + 90, y1: a.y, x2: b.x, y2: b.y, "marker-end": "url(#arrow)" }, group);
      const label = el("text", { x: (a.x + 90 + b.x) / 2, y: (a.y + b.y) / 2 - 5, "text-anchor": "middle" }, group);
      label.textContent = e.relation;
    }
    for (const n of map.nodes) {
      const p = positions[n.id];
      const group = el("g", { class: "node " + n.intent, transform: `translate(${p.x - 90},${p.y - 30})` }, scene);
      el("rect", { width: 180, height: 60 }, group);
      const title = el("title", {}, group);
      title.textContent = `${n.id}\nintent: ${n.intent} · provenance: ${n.provenance}\n` +
        (n.locator ? `locator: ${n.locator}\n` : "") + (n.description || "");
      const label = el("text", { x: 90, y: 26, "text-anchor": "middle" }, group);
      label.textContent = n.label.length > 24 ? n.label.slice(0, 23) + "…" : n.label;
      const sub = el("text", { x: 90, y: 44, "text-anchor": "middle", class: "sub" }, group);
      sub.textContent = n.intent + (n.location === "EXTERNAL" ? " · external" : "");
    }
  }

  // --- panels ---
  async function refresh() {
    try {
      const [map, diff, snapshot] = await Promise.all([
        api("/api/map").then(r => r.json()),
        api("/api/diff").then(r => r.json()),
        api("/api/snapshot").then(r => r.json()),
      ]);
      renderMap(map);
      document.getElementById("mission-meta").textContent = `design revision ${map.design_revision}`;
      document.getElementById("snapshot-meta").textContent =
        snapshot ? `approved snapshot ${snapshot.snapshot_id}` : "no approved snapshot yet";
      const pre = document.getElementById("diff-text");
      pre.innerHTML = "";
      for (const line of diff.text.split("\n")) {
        const span = document.createElement("span");
        span.className = line.startsWith("+") ? "add" : line.startsWith("~") ? "mod" : line.startsWith("-") ? "del" : "";
        span.textContent = line + "\n";
        pre.appendChild(span);
      }
      const history = await api("/api/history").then(r => r.json());
      const list = document.getElementById("history");
      list.innerHTML = "";
      for (const op of history.slice(-30).reverse()) {
        const item = document.createElement("li");
        item.textContent = `#${op.seq} ${op.status} ${op.operation_id} (${op.author}, base ${op.base_revision})`;
        list.appendChild(item);
      }
    } catch (err) { console.error(err); }
  }

  // --- commands ---
  async function send(text) {
    if (!text) return;
    await fetch("/api/command", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
  }
  document.getElementById("approve").onclick = () => send("/approve");
  // prompt() is unavailable in some embedded browsers: fall back to the reply box as reason source.
  const askReason = (label) => {
    try { return prompt(label); } catch (err) {
      const box = document.getElementById("answer");
      const reason = box.value.trim(); box.value = "";
      return reason;
    }
  };
  document.getElementById("reject").onclick = () => { const r = askReason("Reject reason:"); if (r !== null) send("/reject " + r); };
  document.getElementById("abort").onclick = () => { const r = askReason("Abort reason:"); if (r !== null) send("/abort " + r); };
  document.getElementById("send").onclick = () => { const box = document.getElementById("answer"); send(box.value.trim()); box.value = ""; };
  document.getElementById("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("send").click(); });

  // --- event feed via long-poll ---
  let lastEvent = 0;
  function feedLine(event) {
    const item = document.createElement("li");
    const time = document.createElement("span"); time.className = "t";
    time.textContent = (event.timestamp || "").slice(11, 19);
    const kind = document.createElement("span"); kind.className = "k"; kind.textContent = event.kind;
    const body = document.createElement("span");
    const p = event.payload || {};
    body.textContent = p.message || p.summary || p.phase || p.verdict || p.outcome || "";
    item.append(time, kind, body);
    const list = document.getElementById("events");
    list.prepend(item);
    while (list.children.length > 200) list.removeChild(list.lastChild);
  }
  async function poll() {
    while (true) {
      try {
        const data = await api(`/api/events?after=${lastEvent}&wait=25`).then(r => r.json());
        if (data.events.length) {
          for (const event of data.events) { feedLine(event); lastEvent = event.event_id; }
          await refresh();
        }
      } catch (err) { await new Promise(res => setTimeout(res, 3000)); }
    }
  }

  refresh();
  poll();
})();
</script>
</body>
</html>
