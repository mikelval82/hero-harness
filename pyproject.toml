[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hero-harness"
version = "0.1.0"
description = "HERO v2 mission orchestration runtime with contract-governed execution."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mikel Val Calvo" }]
keywords = ["harness", "llm", "agents", "mission-orchestration", "hero"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mikelval82/hero-harness"
Repository = "https://github.com/mikelval82/hero-harness"
Issues = "https://github.com/mikelval82/hero-harness/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
deepseek = ["openai>=1.50"]
dev = []

[project.scripts]
mission = "mission_orchestrator.cli:main"
mission-worker = "mission_orchestrator.worker:main"
code-graph = "mission_orchestrator.adapters.analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mission_orchestrator = ["py.typed", "adapters/web/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
